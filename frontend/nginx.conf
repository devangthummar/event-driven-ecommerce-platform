# ============================================
# Nginx Rate Limiting Zones (Memory & Rate Config)
# ============================================
# Zone for sensitive authentication endpoints (login/register)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Zone for order creation endpoints
limit_req_zone $binary_remote_addr zone=order_limit:10m rate=10r/s;

# Zone for general API endpoints
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Custom HTTP 429 (Too Many Requests) status code for rate limit breaches
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security & Request hardening
    server_tokens off;
    client_max_body_size 10M;
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA Client-Side Routing Fallback (Static assets not rate-limited)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sensitive Auth Endpoints — Strict Rate Limiting (5 req/sec, burst 10)
    location /api/users/login {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://user-service:8006/api/users/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/users/register {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://user-service:8006/api/users/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://user-service:8006/api/users/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/register {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://user-service:8006/api/users/register;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General Auth / User Service endpoints
    location /api/auth/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://user-service:8006/api/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/users/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://user-service:8006/api/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Product Service endpoints
    location /api/products {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://product-service:8081/api/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payment & Wallet Service endpoints
    location /api/wallets {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://payment-service:8085/api/wallets;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/payments {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://payment-service:8085/api/payments;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Inventory Service endpoints
    location /api/inventory {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://inventory-service:8084/api/inventory;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Administrative outbox recovery
    # ------------------------------------------------------------------
    # All three services expose POST /api/admin/outbox/retry-failed (ADMIN
    # only). A single path cannot address three services, so each is given a
    # service-scoped alias here; the backend contract is unchanged and the
    # trailing slash on proxy_pass rewrites the prefix back to /api/admin/.
    location /api/admin/order/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://order-service:8082/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/admin/payment/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://payment-service:8085/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/admin/inventory/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://inventory-service:8084/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Order Service endpoints — Order Rate Limiting (10 req/sec, burst 15)
    location /api/v1/orders {
        limit_req zone=order_limit burst=15 nodelay;
        proxy_pass http://order-service:8082/api/v1/orders;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator Health Observability Endpoints
    location /api/health/user {
        proxy_pass http://user-service:8006/actuator/health;
    }
    location /api/health/product {
        proxy_pass http://product-service:8081/actuator/health;
    }
    location /api/health/order {
        proxy_pass http://order-service:8082/actuator/health;
    }
    location /api/health/inventory {
        proxy_pass http://inventory-service:8084/actuator/health;
    }
    location /api/health/payment {
        proxy_pass http://payment-service:8085/actuator/health;
    }
    location /api/health/notification {
        proxy_pass http://notification-service:8086/actuator/health;
    }
}
