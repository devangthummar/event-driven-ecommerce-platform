# Server Port
server.port=8081

# ==========================================
# JWT Configuration (RS256 - Public Key only)
# ==========================================
# Product Service validates JWTs issued by User Service (same public key as
# Order / Inventory / Payment). Internal callers must propagate the user JWT.
jwt.public-key=${JWT_PUBLIC_KEY:}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:}
jwt.issuer=${JWT_ISSUER:user-service}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/product_service_db
spring.datasource.username=postgres
spring.datasource.password=password

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Actuator / Health / Metrics
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

# Logging
logging.level.org.springframework.web=DEBUG