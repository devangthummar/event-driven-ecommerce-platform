# ============================================
# Test Configuration — Order Service
# ============================================
# H2 in-memory database for unit tests.
# Integration tests that need real PostgreSQL use @TestPropertySource to override.
# Do NOT set spring.datasource.driver-class-name — let Spring auto-detect from URL.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Kafka — keep auto-configuration enabled so KafkaTemplate bean is created.
# The broker doesn't need to be reachable for context loading to succeed.
spring.kafka.bootstrap-servers=localhost:9092

# JWT test config
jwt.public-key=
jwt.public-key-path=
jwt.issuer=user-service

# Product service HTTP client defaults
product.service.url=http://localhost:8081
product.service.connect-timeout-ms=2000
product.service.read-timeout-ms=5000

# Logging
logging.level.org.springframework.web=WARN

# Disable outbox scheduler during tests to prevent querying outbox_messages
# before Hibernate DDL (create-drop) has finished creating the table.
outbox.scheduler.enabled=false
