# Server Port
server.port=8082

# ==========================================
# JWT Configuration (RS256 - Public Key only)
# ==========================================
jwt.public-key=${JWT_PUBLIC_KEY:}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:}
jwt.issuer=${JWT_ISSUER:user-service}

# ==========================================
# Product Service (synchronous HTTP client)
# ==========================================
# Docker Compose overrides this with http://product-service:8081 via PRODUCT_SERVICE_URL.
# Local development talks to http://localhost:8081.
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
# Fail fast when Product Service is unreachable instead of waiting forever.
product.service.connect-timeout-ms=${PRODUCT_SERVICE_CONNECT_TIMEOUT_MS:2000}
# Bound how long a single Product Service response may take.
product.service.read-timeout-ms=${PRODUCT_SERVICE_READ_TIMEOUT_MS:5000}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/order_service_db
spring.datasource.username=postgres
spring.datasource.password=password

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Actuator / Health / Metrics
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

# Logging
logging.level.org.springframework.web=DEBUG

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka Consumer
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*