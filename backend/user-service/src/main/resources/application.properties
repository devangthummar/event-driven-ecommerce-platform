# ==========================================
# Application
# ==========================================
spring.application.name=user-service
server.port=8006

# ==========================================
# PostgreSQL Database
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/user_service_db
spring.datasource.username=postgres
spring.datasource.password=password

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# ==========================================
# JWT Configuration (RS256)
# ==========================================
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:}
jwt.expiration=86400000
jwt.issuer=${JWT_ISSUER:user-service}

# ==========================================
# Actuator / Health
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ==========================================
# Logging
# ==========================================
logging.level.org.springframework.security=DEBUG

